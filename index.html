<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Lokasi & Stok Gudang</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --cell-active: #f59e0b;
      --cell-filled: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-wrapper {
      max-width: 1100px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .denah-switcher {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .switch-btn {
      padding: 10px 24px;
      background: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .switch-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .switch-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: var(--accent);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .panel {
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-sm {
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .btn-danger {
      background: #ef4444;
      color: #fff;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .badge {
      display: inline-block;
      background: var(--accent);
      color: #0f172a;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-family: monospace;
      font-size: 1rem;
    }

    .legend {
      display: flex;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
    }

    .warehouse-map {
      display: flex;
      gap: 16px;
      justify-content: center;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      max-height: 580px;
      overflow: auto;
    }

    .medium-map-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .medium-row-group {
      display: flex;
      gap: 12px;
    }

    .row-numbers {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 26px;
    }

    .row-num {
      height: 32px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
    }

    .block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .block-header {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .rack-pairs {
      display: flex;
      gap: 4px;
    }

    .rack-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cell {
      width: 32px;
      height: 32px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cell:hover {
      border-color: var(--accent);
    }

    .cell.filled {
      background: var(--cell-filled);
    }

    .cell.active {
      background: var(--cell-active) !important;
      border-color: #fff;
    }

    .arrow-indicator {
      text-align: center;
      margin-top: 8px;
      color: var(--accent);
      font-size: 0.85rem;
    }

    .tabs-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 6px 12px;
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #1e293b;
      color: var(--accent);
      font-weight: 600;
    }

    tr:hover {
      background: rgba(56, 189, 248, 0.05);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 16px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Tombol Pemilih Denah Utama -->
    <div class="denah-switcher">
      <button class="switch-btn active" id="btnSwitchSmall" onclick="switchWarehouseView('SMALL')">Denah Small & Large</button>
      <button class="switch-btn" id="btnSwitchMedium" onclick="switchWarehouseView('MEDIUM')">Denah Medium</button>
    </div>

    <div class="container">
      <div>
        <h1 id="viewTitle">Sistem Lokasi & Stok (Small & Large)</h1>
        <p class="subtitle">Manajemen Informasi Barang Per Lokasi (Online Database)</p>

        <div class="panel">
          <div class="panel-title">
            <span>Detail Lokasi: <span class="badge" id="codeBadge">A-L-01</span></span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
            <div class="input-group">
              <label>Blok</label>
              <select id="blockSelect" onchange="updateLocationUI()"></select>
            </div>

            <div class="input-group">
              <label>Sisi</label>
              <select id="sideSelect" onchange="updateLocationUI()">
                <option value="L">Kiri (L)</option>
                <option value="R">Kanan (R)</option>
              </select>
            </div>

            <div class="input-group">
              <label>Baris</label>
              <input type="number" id="rowInput" min="1" max="15" value="1" onchange="updateLocationUI()" />
            </div>
          </div>

          <hr style="border-color: var(--border); margin: 4px 0;" />

          <div class="panel-title">Keterangan Barang</div>

          <!-- Form Khusus Small -->
          <div id="formSmallContainer">
            <div class="input-group">
              <label for="mcsInput">MCS</label>
              <select id="mcsInput">
                <option value="">-- Pilih MCS --</option>
                <option value="RIP-024">RIP-024</option>
                <option value="LCIP-001">LCIP-001</option>
                <option value="LCIP-003">LCIP-003</option>
                <option value="LCIP-024">LCIP-024</option>
                <option value="IU-007">IU-007</option>
                <option value="IU-009">IU-009</option>
                <option value="CMP-014">CMP-014</option>
                <option value="CMP-001">CMP-001</option>
              </select>
            </div>

            <div class="input-group" style="margin-top: 8px;">
              <label for="colorInputSmall">Warna</label>
              <input type="text" id="colorInputSmall" placeholder="Contoh: Merah / Hitam" />
            </div>

            <div class="form-grid-2" style="margin-top: 8px;">
              <div class="input-group">
                <label for="qtySInput">QTY Size S (Kg)</label>
                <input type="number" id="qtySInput" placeholder="0" min="0" step="any" />
              </div>

              <div class="input-group">
                <label for="qtyLInput">QTY Size L (Kg)</label>
                <input type="number" id="qtyLInput" placeholder="0" min="0" step="any" />
              </div>
            </div>
          </div>

          <!-- Form Khusus Medium -->
          <div id="formMediumContainer" style="display: none;">
            <div class="input-group">
              <label for="modelInputMedium">Model</label>
              <input type="text" id="modelInputMedium" placeholder="Masukkan Jenis Model" />
            </div>

            <div class="input-group" style="margin-top: 8px;">
              <label for="colorInputMedium">Warna</label>
              <input type="text" id="colorInputMedium" placeholder="Contoh: Merah / Putih" />
            </div>

            <div class="input-group" style="margin-top: 8px;">
              <label for="qtyMediumInput">QTY Medium (Kg)</label>
              <input type="number" id="qtyMediumInput" placeholder="0" min="0" step="any" />
            </div>
          </div>

          <div class="btn-group" style="margin-top: 12px;">
            <button class="btn" onclick="saveItemData()">Simpan / Update Data</button>
            <button class="btn btn-danger" onclick="deleteItemData()">Kosongkan Lokasi</button>
          </div>
        </div>
      </div>

      <div>
        <div class="panel">
          <div class="panel-title">
            <span>Denah Gudang</span>
            <div class="legend">
              <div class="legend-item"><div class="legend-box" style="background:#0f172a; border:1px solid #334155;"></div> Kosong</div>
              <div class="legend-item"><div class="legend-box" style="background:var(--cell-filled);"></div> Terisi</div>
              <div class="legend-item"><div class="legend-box" style="background:var(--cell-active);"></div> Dipilih</div>
            </div>
          </div>

          <div class="warehouse-map">
            <!-- Container Map Small -->
            <div id="mapSmall" style="display: flex; gap: 16px;">
              <div class="row-numbers" id="rowNumbersSmall"></div>
              <div class="block">
                <div class="block-header">A</div>
                <div class="rack-pairs">
                  <div class="rack-column" id="col-A-L"></div>
                  <div class="rack-column" id="col-A-R"></div>
                </div>
                <div class="arrow-indicator">&darr; 1-way</div>
              </div>
              <div class="block">
                <div class="block-header">B</div>
                <div class="rack-pairs">
                  <div class="rack-column" id="col-B-L"></div>
                  <div class="rack-column" id="col-B-R"></div>
                </div>
                <div class="arrow-indicator">&darr; 1-way</div>
              </div>
              <div class="block">
                <div class="block-header">C</div>
                <div class="rack-pairs">
                  <div class="rack-column" id="col-C-L"></div>
                  <div class="rack-column" id="col-C-R"></div>
                </div>
                <div class="arrow-indicator">&darr; 1-way</div>
              </div>
            </div>

            <!-- Container Map Medium -->
            <div id="mapMedium" class="medium-map-grid" style="display: none;">
              <!-- Row 1: Blok A - E (4 Baris) -->
              <div class="medium-row-group" id="mediumGroup1"></div>
              <!-- Row 2: Blok F - J (4 Baris) -->
              <div class="medium-row-group" id="mediumGroup2"></div>
              <!-- Row 3: Blok K - O (7 Baris) -->
              <div class="medium-row-group" id="mediumGroup3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel Tabel Stok -->
    <div class="panel" style="background: var(--card-bg);">
      <div class="panel-title">
        <span id="summaryTitle">Daftar Stok Berdasarkan MCS</span>
        <span id="totalSummaryBadge" style="font-size: 0.8rem; color: var(--text-muted);">Menghubungkan ke Database...</span>
      </div>

      <div class="tabs-container" id="mcsTabsContainer">
        <button class="tab-btn active" onclick="switchMcsTab('ALL', this)">Semua MCS</button>
        <button class="tab-btn" onclick="switchMcsTab('RIP-024', this)">RIP-024</button>
        <button class="tab-btn" onclick="switchMcsTab('LCIP-001', this)">LCIP-001</button>
        <button class="tab-btn" onclick="switchMcsTab('LCIP-003', this)">LCIP-003</button>
        <button class="tab-btn" onclick="switchMcsTab('LCIP-024', this)">LCIP-024</button>
        <button class="tab-btn" onclick="switchMcsTab('IU-007', this)">IU-007</button>
        <button class="tab-btn" onclick="switchMcsTab('IU-009', this)">IU-009</button>
        <button class="tab-btn" onclick="switchMcsTab('CMP-014', this)">CMP-014</button>
        <button class="tab-btn" onclick="switchMcsTab('CMP-001', this)">CMP-001</button>
      </div>

      <div class="table-container">
        <table>
          <thead id="inventoryTableHead"></thead>
          <tbody id="inventoryTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAC6hkXMsuB2wpYKbKBoYfuifdQVFykdHY",
      authDomain: "lokasi-system.firebaseapp.com",
      databaseURL: "https://lokasi-system-default-rtdb.firebaseio.com",
      projectId: "lokasi-system",
      storageBucket: "lokasi-system.firebasestorage.app",
      messagingSenderId: "106677338807",
      appId: "1:106677338807:web:dcbeb6f34a387d4dba0332",
      measurementId: "G-9QERTR8VYZ"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const stockRefSmall = ref(database, 'warehouseStock');
    const stockRefMedium = ref(database, 'warehouseStockMedium');

    let currentWarehouseMode = 'SMALL'; // 'SMALL' atau 'MEDIUM'
    let activeMcsTab = 'ALL';

    let warehouseDataSmall = {};
    let warehouseDataMedium = {};

    const smallBlocks = ['A', 'B', 'C'];
    const mediumBlocksConfig = {
      group1: { blocks: ['A', 'B', 'C', 'D', 'E'], rows: 4 },
      group2: { blocks: ['F', 'G', 'H', 'I', 'J'], rows: 4 },
      group3: { blocks: ['K', 'L', 'M', 'N', 'O'], rows: 7 }
    };

    function initMaps() {
      // Build Small Map
      const rowNumSmall = document.getElementById('rowNumbersSmall');
      rowNumSmall.innerHTML = '';
      for (let r = 1; r <= 15; r++) {
        const div = document.createElement('div');
        div.className = 'row-num';
        div.textContent = r;
        rowNumSmall.appendChild(div);
      }

      smallBlocks.forEach(block => {
        ['L', 'R'].forEach(side => {
          const colContainer = document.getElementById(`col-${block}-${side}`);
          colContainer.innerHTML = '';
          for (let r = 1; r <= 15; r++) {
            const locCode = `${block}-${side}-${String(r).padStart(2, '0')}`;
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-SMALL-${locCode}`;
            cell.onclick = () => selectCell(block, side, r);
            colContainer.appendChild(cell);
          }
        });
      });

      // Build Medium Map
      Object.keys(mediumBlocksConfig).forEach((grpKey, idx) => {
        const groupObj = mediumBlocksConfig[grpKey];
        const container = document.getElementById(`mediumGroup${idx + 1}`);
        container.innerHTML = '';

        // Add Row Numbers
        const rowNums = document.createElement('div');
        rowNums.className = 'row-numbers';
        for (let r = 1; r <= groupObj.rows; r++) {
          const div = document.createElement('div');
          div.className = 'row-num';
          div.textContent = r;
          rowNums.appendChild(div);
        }
        container.appendChild(rowNums);

        groupObj.blocks.forEach(block => {
          const blockDiv = document.createElement('div');
          blockDiv.className = 'block';

          const header = document.createElement('div');
          header.className = 'block-header';
          header.textContent = block;
          blockDiv.appendChild(header);

          const rackPairs = document.createElement('div');
          rackPairs.className = 'rack-pairs';

          ['L', 'R'].forEach(side => {
            const col = document.createElement('div');
            col.className = 'rack-column';
            for (let r = 1; r <= groupObj.rows; r++) {
              const locCode = `${block}-${side}-${String(r).padStart(2, '0')}`;
              const cell = document.createElement('div');
              cell.className = 'cell';
              cell.id = `cell-MEDIUM-${locCode}`;
              cell.onclick = () => selectCell(block, side, r);
              col.appendChild(cell);
            }
            rackPairs.appendChild(col);
          });

          blockDiv.appendChild(rackPairs);
          container.appendChild(blockDiv);
        });
      });

      // Firebase Realtime Observers
      onValue(stockRefSmall, (snapshot) => {
        warehouseDataSmall = snapshot.val() || {};
        renderFilledCells();
        renderInventoryTable();
      });

      onValue(stockRefMedium, (snapshot) => {
        warehouseDataMedium = snapshot.val() || {};
        renderFilledCells();
        renderInventoryTable();
      });

      switchWarehouseView('SMALL');
    }

    window.switchWarehouseView = function(mode) {
      currentWarehouseMode = mode;

      document.getElementById('btnSwitchSmall').classList.toggle('active', mode === 'SMALL');
      document.getElementById('btnSwitchMedium').classList.toggle('active', mode === 'MEDIUM');

      document.getElementById('mapSmall').style.display = mode === 'SMALL' ? 'flex' : 'none';
      document.getElementById('mapMedium').style.display = mode === 'MEDIUM' ? 'flex' : 'none';

      document.getElementById('formSmallContainer').style.display = mode === 'SMALL' ? 'block' : 'none';
      document.getElementById('formMediumContainer').style.display = mode === 'MEDIUM' ? 'block' : 'none';

      document.getElementById('mcsTabsContainer').style.display = mode === 'SMALL' ? 'flex' : 'none';

      document.getElementById('viewTitle').textContent = mode === 'SMALL' 
        ? 'Sistem Lokasi & Stok (Small & Large)' 
        : 'Sistem Lokasi & Stok (Medium)';

      document.getElementById('summaryTitle').textContent = mode === 'SMALL' 
        ? 'Daftar Stok Berdasarkan MCS' 
        : 'Daftar Stok Lokasi Medium (Model & Warna)';

      // Update Select Block Options
      const blockSelect = document.getElementById('blockSelect');
      blockSelect.innerHTML = '';

      const blocksToLoad = mode === 'SMALL' 
        ? smallBlocks 
        : ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];

      blocksToLoad.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = `Blok ${b}`;
        blockSelect.appendChild(opt);
      });

      document.getElementById('rowInput').value = 1;
      updateLocationUI();
      renderFilledCells();
      renderInventoryTable();
    };

    function renderFilledCells() {
      if (currentWarehouseMode === 'SMALL') {
        smallBlocks.forEach(block => {
          ['L', 'R'].forEach(side => {
            for (let r = 1; r <= 15; r++) {
              const locCode = `${block}-${side}-${String(r).padStart(2, '0')}`;
              const cell = document.getElementById(`cell-SMALL-${locCode}`);
              if (cell) {
                const data = warehouseDataSmall[locCode];
                const qtyS = parseFloat(data?.qtyS) || 0;
                const qtyL = parseFloat(data?.qtyL) || 0;
                if (data && (data.mcs || qtyS > 0 || qtyL > 0 || data.color)) {
                  cell.classList.add('filled');
                  cell.title = `${locCode} | MCS: ${data.mcs || '-'} | Warna: ${data.color || '-'} | S: ${qtyS} Kg | L: ${qtyL} Kg`;
                } else {
                  cell.classList.remove('filled');
                  cell.title = `${locCode} (Kosong)`;
                }
              }
            }
          });
        });
      } else {
        Object.keys(mediumBlocksConfig).forEach(grpKey => {
          const groupObj = mediumBlocksConfig[grpKey];
          groupObj.blocks.forEach(block => {
            ['L', 'R'].forEach(side => {
              for (let r = 1; r <= groupObj.rows; r++) {
                const locCode = `${block}-${side}-${String(r).padStart(2, '0')}`;
                const cell = document.getElementById(`cell-MEDIUM-${locCode}`);
                if (cell) {
                  const data = warehouseDataMedium[locCode];
                  const qtyM = parseFloat(data?.qtyM) || 0;
                  if (data && (data.model || data.color || qtyM > 0)) {
                    cell.classList.add('filled');
                    cell.title = `${locCode} | Model: ${data.model || '-'} | Warna: ${data.color || '-'} | QTY: ${qtyM} Kg`;
                  } else {
                    cell.classList.remove('filled');
                    cell.title = `${locCode} (Kosong)`;
                  }
                }
              }
            });
          });
        });
      }
    }

    function getMaxRowForBlock(block) {
      if (currentWarehouseMode === 'SMALL') return 15;
      if (['A','B','C','D','E','F','G','H','I','J'].includes(block)) return 4;
      return 7;
    }

    window.updateLocationUI = function() {
      const block = document.getElementById('blockSelect').value;
      const side = document.getElementById('sideSelect').value;
      let row = parseInt(document.getElementById('rowInput').value);

      const maxRow = getMaxRowForBlock(block);
      if (isNaN(row) || row < 1) row = 1;
      if (row > maxRow) row = maxRow;
      document.getElementById('rowInput').value = row;
      document.getElementById('rowInput').max = maxRow;

      const formattedRow = String(row).padStart(2, '0');
      const locCode = `${block}-${side}-${formattedRow}`;

      document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
      const activeCell = document.getElementById(`cell-${currentWarehouseMode}-${locCode}`);
      if (activeCell) activeCell.classList.add('active');

      document.getElementById('codeBadge').textContent = locCode;

      if (currentWarehouseMode === 'SMALL') {
        const item = warehouseDataSmall[locCode];
        document.getElementById('mcsInput').value = item?.mcs || '';
        document.getElementById('colorInputSmall').value = item?.color || '';
        document.getElementById('qtySInput').value = item?.qtyS || '';
        document.getElementById('qtyLInput').value = item?.qtyL || '';
      } else {
        const item = warehouseDataMedium[locCode];
        document.getElementById('modelInputMedium').value = item?.model || '';
        document.getElementById('colorInputMedium').value = item?.color || '';
        document.getElementById('qtyMediumInput').value = item?.qtyM || '';
      }
    };

    function selectCell(block, side, row) {
      document.getElementById('blockSelect').value = block;
      document.getElementById('sideSelect').value = side;
      document.getElementById('rowInput').value = row;
      updateLocationUI();
    }

    window.switchMcsTab = function(mcsType, btnElement) {
      activeMcsTab = mcsType;
      document.querySelectorAll('#mcsTabsContainer .tab-btn').forEach(btn => btn.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
      renderInventoryTable();
    };

    function renderInventoryTable() {
      const thead = document.getElementById('inventoryTableHead');
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = '';

      if (currentWarehouseMode === 'SMALL') {
        thead.innerHTML = `
          <tr>
            <th>Lokasi</th>
            <th>MCS</th>
            <th>Warna</th>
            <th>QTY S</th>
            <th>QTY L</th>
            <th>Aksi</th>
          </tr>
        `;

        const locations = Object.keys(warehouseDataSmall).sort();
        let totalQtySGudang = 0;
        let totalQtyLGudang = 0;
        let count = 0;

        locations.forEach(locCode => {
          const item = warehouseDataSmall[locCode];
          const qtyS = parseFloat(item?.qtyS) || 0;
          const qtyL = parseFloat(item?.qtyL) || 0;

          if (item && (item.mcs || item.color || qtyS > 0 || qtyL > 0)) {
            if (activeMcsTab === 'ALL' || item.mcs === activeMcsTab) {
              count++;
              totalQtySGudang += qtyS;
              totalQtyLGudang += qtyL;

              const row = document.createElement('tr');
              row.innerHTML = `
                <td><strong>${locCode}</strong></td>
                <td>${item.mcs || '-'}</td>
                <td>${item.color || '-'}</td>
                <td>${qtyS} Kg</td>
                <td>${qtyL} Kg</td>
                <td>
                  <button class="btn btn-sm" onclick="goToLocation('${locCode}')">Lihat Lokasi</button>
                </td>
              `;
              tbody.appendChild(row);
            }
          }
        });

        if (count === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-msg">Belum ada barang terdata.</td></tr>`;
        }

        const labelFilter = activeMcsTab === 'ALL' ? 'Keseluruhan' : activeMcsTab;
        document.getElementById('totalSummaryBadge').textContent = `[Filter: ${labelFilter}] ${count} Lokasi | S: ${totalQtySGudang} Kg | L: ${totalQtyLGudang} Kg`;

      } else {
        thead.innerHTML = `
          <tr>
            <th>Lokasi</th>
            <th>Model</th>
            <th>Warna</th>
            <th>QTY Medium</th>
            <th>Aksi</th>
          </tr>
        `;

        const locations = Object.keys(warehouseDataMedium).sort();
        let totalQtyMedium = 0;
        let count = 0;

        locations.forEach(locCode => {
          const item = warehouseDataMedium[locCode];
          const qtyM = parseFloat(item?.qtyM) || 0;

          if (item && (item.model || item.color || qtyM > 0)) {
            count++;
            totalQtyMedium += qtyM;

            const row = document.createElement('tr');
            row.innerHTML = `
              <td><strong>${locCode}</strong></td>
              <td>${item.model || '-'}</td>
              <td>${item.color || '-'}</td>
              <td>${qtyM} Kg</td>
              <td>
                <button class="btn btn-sm" onclick="goToLocation('${locCode}')">Lihat Lokasi</button>
              </td>
            `;
            tbody.appendChild(row);
          }
        });

        if (count === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="empty-msg">Belum ada barang Medium terdata.</td></tr>`;
        }

        document.getElementById('totalSummaryBadge').textContent = `Total: ${count} Lokasi | QTY Medium: ${totalQtyMedium} Kg`;
      }
    }

    window.goToLocation = function(locCode) {
      const parts = locCode.split('-');
      if (parts.length === 3) {
        document.getElementById('blockSelect').value = parts[0];
        document.getElementById('sideSelect').value = parts[1];
        document.getElementById('rowInput').value = parseInt(parts[2]);
        updateLocationUI();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    };

    function getCurrentLocationCode() {
      const block = document.getElementById('blockSelect').value;
      const side = document.getElementById('sideSelect').value;
      let row = parseInt(document.getElementById('rowInput').value);

      const maxRow = getMaxRowForBlock(block);
      if (isNaN(row) || row < 1) row = 1;
      if (row > maxRow) row = maxRow;

      return `${block}-${side}-${String(row).padStart(2, '0')}`;
    }

    window.saveItemData = function() {
      const locCode = getCurrentLocationCode();

      if (currentWarehouseMode === 'SMALL') {
        const mcs = document.getElementById('mcsInput').value;
        const color = document.getElementById('colorInputSmall').value.trim();
        const qtyS = document.getElementById('qtySInput').value.trim();
        const qtyL = document.getElementById('qtyLInput').value.trim();

        if (!mcs && !color && !qtyS && !qtyL) {
          alert('Harap isi data barang Small!');
          return;
        }

        set(ref(database, 'warehouseStock/' + locCode), {
          mcs, color, qtyS, qtyL
        }).then(() => alert(`Data lokasi Small ${locCode} tersimpan!`));

      } else {
        const model = document.getElementById('modelInputMedium').value.trim();
        const color = document.getElementById('colorInputMedium').value.trim();
        const qtyM = document.getElementById('qtyMediumInput').value.trim();

        if (!model && !color && !qtyM) {
          alert('Harap isi data barang Medium!');
          return;
        }

        set(ref(database, 'warehouseStockMedium/' + locCode), {
          model, color, qtyM
        }).then(() => alert(`Data lokasi Medium ${locCode} tersimpan!`));
      }
    };

    window.deleteItemData = function() {
      const locCode = getCurrentLocationCode();
      const dbPath = currentWarehouseMode === 'SMALL' 
        ? 'warehouseStock/' + locCode 
        : 'warehouseStockMedium/' + locCode;

      if (confirm(`Kosongkan lokasi ${locCode}?`)) {
        remove(ref(database, dbPath)).then(() => alert(`Lokasi ${locCode} dikosongkan!`));
      }
    };

    window.onload = initMaps;
  </script>
</body>
</html>
